plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ialocal'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.ialocal"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Gemini Nano pelo ML Kit (AICore): roda no próprio celular, sem custo, nos aparelhos que têm.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
}
