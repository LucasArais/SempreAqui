# Sobe a API com um comando:  docker compose up
# O banco é o Supabase (migrações em backend/db/migrations, aplicadas com
# "uv run python -m db.migrar"). Sem Supabase configurado, a API usa um SQLite local.
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - api_dados:/app/dados

volumes:
  api_dados:
